experiment:
  name: wztarf_v1
  seed: 2023

data:
  fps: 5
  history_steps: 10
  future_steps: 25
  num_modes: 6

model:
  d_model: 128
  motion_hidden: 128
  control_hidden: 64
  gaze_hidden: 64
  agent_hidden: 64
  top_seed_lanes: 4
  lane_graph_layers: 2
  route_decoder_layers: 2
  use_refiner: false

training:
  epochs: 64
  batch_size: 8
  learning_rate: 0.0005
  weight_decay: 0.0001
  beta_assign: 0.25
  lambda_endpoint: 0.25
  lambda_diversity: 0.0

evaluation:
  miss_threshold_m: 2.0
  worker_threshold_m: 2.0
  latency_warmup: 20
  latency_iterations: 200
